name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: AiSkyKit (unit tests on macOS + iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Open-Meteo history consistency (temporary diagnostic)
        continue-on-error: true
        run: |
          base="https://api.open-meteo.com/v1/forecast?latitude=41.8781&longitude=-87.6298&timezone=auto"
          today=$(TZ=America/Chicago date +%Y-%m-%d)
          start85=$(TZ=America/Chicago date -v-85d +%Y-%m-%d)
          yesterday=$(TZ=America/Chicago date -v-1d +%Y-%m-%d)
          start10=$(TZ=America/Chicago date -v-40d +%Y-%m-%d)
          curl -sS "$base&daily=precipitation_sum&past_days=31&forecast_days=1" -o pastdays.json
          curl -sS "$base&daily=precipitation_sum,snowfall_sum&start_date=$start85&end_date=$yesterday" -o range85.json
          curl -sS "$base&daily=precipitation_sum&start_date=$start10&end_date=$yesterday" -o range40.json
          curl -sS "https://archive-api.open-meteo.com/v1/archive?latitude=41.8781&longitude=-87.6298&timezone=auto&daily=precipitation_sum&start_date=$start10&end_date=$yesterday" -o archive.json
          python3 - <<'EOF'
          import json
          def load(name):
              d = json.load(open(name))
              if "daily" not in d:
                  print(name, "ERROR", d)
                  return {}
              return dict(zip(d["daily"]["time"], d["daily"]["precipitation_sum"]))
          a, b, c, e = load("pastdays.json"), load("range85.json"), load("range40.json"), load("archive.json")
          print("date        past_days  range85  range40  archive   (mm)")
          for day in sorted(set(a) | set(c)):
              print(f"{day}  {a.get(day)!s:>9}  {b.get(day)!s:>7}  {c.get(day)!s:>7}  {e.get(day)!s:>7}")
          for name in ("pastdays.json", "range85.json"):
              d = json.load(open(name))
              print(name, {k: d.get(k) for k in ("timezone", "utc_offset_seconds", "latitude", "longitude")})
          EOF

      - name: Unit tests (macOS)
        run: swift test --package-path Packages/AiSkyKit

      - name: Unit tests (iOS Simulator)
        working-directory: Packages/AiSkyKit
        run: |
          sim=$(../../.github/scripts/pick-simulator.sh)
          echo "Simulator: $sim"
          xcodebuild test \
            -scheme AiSkyKit \
            -destination "platform=iOS Simulator,id=${sim##*|}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || status=$?
          grep -E "(error|warning): |Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|failed \(" test.log | sort -u | head -100 || true
          tail -n 5 test.log
          exit ${status:-0}

  app:
    name: iOS app + widgets (build & Simulator smoke test)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Pick a simulator
        id: sim
        run: |
          sim=$(.github/scripts/pick-simulator.sh)
          echo "Using simulator: $sim"
          echo "name=${sim%%|*}" >> "$GITHUB_OUTPUT"
          echo "udid=${sim##*|}" >> "$GITHUB_OUTPUT"

      - name: Build app and widget extension
        run: |
          xcodebuild build \
            -project AiSky.xcodeproj \
            -scheme AiSky \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          echo "::group::Errors and warnings"
          grep -E "(error|warning): " build.log | sort -u | head -200 || true
          echo "::endgroup::"
          tail -n 5 build.log
          exit ${status:-0}

      - name: Verify widget extension is embedded
        run: |
          app=DerivedData/Build/Products/Debug-iphonesimulator/AiSky.app
          test -d "$app/PlugIns/AiSkyWidgetsExtension.appex"
          plutil -p "$app/Info.plist" | grep -E "CFBundleIdentifier|AiSkyAppGroup|com.lasmith|NSLocationWhenInUse"
          plutil -p "$app/PlugIns/AiSkyWidgetsExtension.appex/Info.plist" | grep -E "CFBundleIdentifier|NSExtensionPointIdentifier|NSWidgetWantsLocation"

      - name: Smoke test in the Simulator
        run: .github/scripts/smoke-test.sh "${{ steps.sim.outputs.udid }}" DerivedData/Build/Products/Debug-iphonesimulator/AiSky.app screenshots

      - name: Read screenshots (OCR)
        if: always()
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          swift .github/scripts/ocr.swift screenshots/*.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Preview images for review (base64 JPEG)
        if: always()
        run: |
          for name in 01-forecast 04-daily 05-precipitation 11-rain-history 12-time-machine 13-radar-spot; do
            [ -f "screenshots/$name.png" ] || continue
            sips -Z 700 -s format jpeg -s formatOptions 40 "screenshots/$name.png" --out "/tmp/$name.jpg" >/dev/null
            echo "=====BEGIN $name.jpg====="
            base64 -i "/tmp/$name.jpg" | fold -w 180
            echo "=====END $name.jpg====="
          done
