name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: AiSkyKit (unit tests on macOS + iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Open-Meteo history consistency (temporary diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, subprocess, urllib.parse
          base = "https://api.open-meteo.com/v1/forecast"
          app = {
              "latitude": "41.8781", "longitude": "-87.6298",
              "current": "temperature_2m,relative_humidity_2m,dew_point_2m,apparent_temperature,is_day,precipitation,snowfall,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,uv_index",
              "minutely_15": "precipitation,snowfall,weather_code",
              "hourly": "temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation_probability,precipitation,snowfall,weather_code,cloud_cover,pressure_msl,visibility,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,is_day",
              "daily": "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,uv_index_max,precipitation_sum,snowfall_sum,precipitation_hours,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant",
              "timezone": "auto", "timeformat": "iso8601",
              "past_minutely_15": "2", "forecast_minutely_15": "12",
              "past_hours": "168", "forecast_hours": "240",
              "past_days": "31", "forecast_days": "10",
          }
          def fetch(label, params):
              url = base + "?" + urllib.parse.urlencode(params)
              try:
                  d = json.loads(subprocess.run(["curl", "-sS", "--max-time", "60", url], capture_output=True, text=True, check=True).stdout)
              except Exception as e:
                  print(label, "ERROR", e)
                  return {}
              daily = d.get("daily", {})
              values = dict(zip(daily.get("time", []), daily.get("precipitation_sum", [])))
              hourly = d.get("hourly", {})
              print(f"{label}: {len(daily.get('time', []))} days, {len(hourly.get('time', []))} hours, first hour {hourly.get('time', [None])[0]}")
              return values
          core = {"latitude": "41.8781", "longitude": "-87.6298", "timezone": "auto", "past_days": "31", "forecast_days": "1"}
          variants = {
              "app": app,
              "daily only": core | {"daily": "precipitation_sum"},
              "daily+hourly precip": core | {"daily": "precipitation_sum", "hourly": "precipitation"},
              "all daily vars": core | {"daily": app["daily"]},
              "daily+prob max": core | {"daily": "precipitation_sum,precipitation_probability_max"},
              "daily+weather code": core | {"daily": "precipitation_sum,weather_code"},
              "daily+current": core | {"daily": "precipitation_sum", "current": "temperature_2m"},
              "hrrr": core | {"daily": "precipitation_sum", "models": "ncep_hrrr_conus"},
              "gfs_seamless": core | {"daily": "precipitation_sum", "models": "gfs_seamless"},
              "nbm": core | {"daily": "precipitation_sum", "models": "ncep_nbm_conus"},
              "icon_seamless": core | {"daily": "precipitation_sum", "models": "icon_seamless"},
              "ecmwf_ifs025": core | {"daily": "precipitation_sum", "models": "ecmwf_ifs025"},
          }
          results = {name: fetch(name, params) for name, params in variants.items()}
          days = [d for d in sorted(results["daily only"]) if "2026-09-14" <= d <= "2026-09-21"]
          for name, values in results.items():
              print(f"{name:>20}: " + " ".join(f"{values.get(day)!s:>6}" for day in days))
          print(" " * 22 + " ".join(day[5:] for day in days))
          EOF

      - name: Unit tests (macOS)
        run: swift test --package-path Packages/AiSkyKit

      - name: Unit tests (iOS Simulator)
        working-directory: Packages/AiSkyKit
        run: |
          sim=$(../../.github/scripts/pick-simulator.sh)
          echo "Simulator: $sim"
          xcodebuild test \
            -scheme AiSkyKit \
            -destination "platform=iOS Simulator,id=${sim##*|}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || status=$?
          grep -E "(error|warning): |Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|failed \(" test.log | sort -u | head -100 || true
          tail -n 5 test.log
          exit ${status:-0}

  app:
    name: iOS app + widgets (build & Simulator smoke test)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Pick a simulator
        id: sim
        run: |
          sim=$(.github/scripts/pick-simulator.sh)
          echo "Using simulator: $sim"
          echo "name=${sim%%|*}" >> "$GITHUB_OUTPUT"
          echo "udid=${sim##*|}" >> "$GITHUB_OUTPUT"

      - name: Build app and widget extension
        run: |
          xcodebuild build \
            -project AiSky.xcodeproj \
            -scheme AiSky \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          echo "::group::Errors and warnings"
          grep -E "(error|warning): " build.log | sort -u | head -200 || true
          echo "::endgroup::"
          tail -n 5 build.log
          exit ${status:-0}

      - name: Verify widget extension is embedded
        run: |
          app=DerivedData/Build/Products/Debug-iphonesimulator/AiSky.app
          test -d "$app/PlugIns/AiSkyWidgetsExtension.appex"
          plutil -p "$app/Info.plist" | grep -E "CFBundleIdentifier|AiSkyAppGroup|com.lasmith|NSLocationWhenInUse"
          plutil -p "$app/PlugIns/AiSkyWidgetsExtension.appex/Info.plist" | grep -E "CFBundleIdentifier|NSExtensionPointIdentifier|NSWidgetWantsLocation"

      - name: Smoke test in the Simulator
        run: .github/scripts/smoke-test.sh "${{ steps.sim.outputs.udid }}" DerivedData/Build/Products/Debug-iphonesimulator/AiSky.app screenshots

      - name: Read screenshots (OCR)
        if: always()
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          swift .github/scripts/ocr.swift screenshots/*.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Preview images for review (base64 JPEG)
        if: always()
        run: |
          for name in 01-forecast 04-daily 05-precipitation 11-rain-history 12-time-machine 13-radar-spot; do
            [ -f "screenshots/$name.png" ] || continue
            sips -Z 700 -s format jpeg -s formatOptions 40 "screenshots/$name.png" --out "/tmp/$name.jpg" >/dev/null
            echo "=====BEGIN $name.jpg====="
            base64 -i "/tmp/$name.jpg" | fold -w 180
            echo "=====END $name.jpg====="
          done
