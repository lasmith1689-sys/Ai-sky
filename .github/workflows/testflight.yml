name: TestFlight

# Signs the App Store build and uploads it to TestFlight. Runs only when started by hand
# (Actions > TestFlight > Run workflow) or on a push whose head commit message contains
# [ship], so work in progress doesn't land on your phone. CI still builds every push.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  # Every push still starts a run (its job is skipped without [ship]). Keep those runs in their own
  # group so a later push can't cancel an upload that's in progress.
  group: testflight-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ship]') }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: App Store build (uploads to TestFlight when set up)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ship]')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          AISKY_BUNDLE_ID_PREFIX: ${{ vars.AISKY_BUNDLE_ID_PREFIX }}
          AISKY_ENABLE_WEATHERKIT: ${{ vars.AISKY_ENABLE_WEATHERKIT }}
          # Must grow with every upload; re-running a workflow bumps the second number.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash .github/scripts/testflight.sh
