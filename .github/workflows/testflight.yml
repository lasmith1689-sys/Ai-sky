name: TestFlight

# Builds the App Store version on every push. Once the App Store Connect secrets are added
# (see TESTFLIGHT.md), each build is also signed and uploaded to TestFlight.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: App Store build (uploads to TestFlight when set up)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          AISKY_BUNDLE_ID_PREFIX: ${{ vars.AISKY_BUNDLE_ID_PREFIX }}
          AISKY_ENABLE_WEATHERKIT: ${{ vars.AISKY_ENABLE_WEATHERKIT }}
          # Must grow with every upload; re-running a workflow bumps the second number.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash .github/scripts/testflight.sh
